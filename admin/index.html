<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - Baytonia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Tajawal'}</style>
</head>
<body class="bg-[#F9F6F1] p-3">
<div id="loginBox" class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-2xl border">
<h2 class="font-black text-center text-xl">لوحة تحكم المتجر 🔐</h2>
<p class="text-[12px] text-center text-gray-500 mt-1">تحكم بالصور والأسعار والشارات</p>
<input id="pass" type="password" placeholder="كلمة السر: admin123" class="w-full mt-4 h-12 border rounded-full px-4 outline-none">
<button onclick="login()" class="w-full mt-3 bg-black text-white h-12 rounded-full font-bold">دخول</button>
</div>

<div id="panel" class="hidden max-w-6xl mx-auto">
<div class="bg-white p-4 rounded-xl border flex justify-between items-center"><b>إدارة متجر Baytonia 🛏️</b><a href="../" class="text-[#C8A97E] text-sm font-bold">عرض المتجر →</a></div>

<div class="grid md:grid-cols-3 gap-4 mt-4">
<div class="bg-white p-4 rounded-xl border h-fit">
<h3 class="font-bold mb-3">➕ إضافة منتج جديد</h3>

<label class="text-[11px] font-bold">اسم المنتج (يظهر تحت الصورة)</label>
<input id="name" placeholder="مثلا: سرير فلان 180x200" class="w-full h-10 border rounded-full px-3 mb-2 text-sm mt-1">

<label class="text-[11px] font-bold">رابط الصورة</label>
<input id="img" placeholder="https://images.unsplash.com/..." class="w-full h-10 border rounded-full px-3 mb-2 text-sm mt-1">

<div class="grid grid-cols-2 gap-2">
<div><label class="text-[11px] font-bold">السعر الحالي</label><input id="price" type="number" placeholder="2699" class="w-full h-10 border rounded-full px-3 text-sm mt-1"></div>
<div><label class="text-[11px] font-bold">السعر القديم</label><input id="oldPrice" type="number" placeholder="4299" class="w-full h-10 border rounded-full px-3 text-sm mt-1"></div>
</div>

<label class="text-[11px] font-bold mt-2 block">الشارة اليسار (Premium / توصيل سريع / أي اسم)</label>
<input id="badgeLeft" value="Premium" placeholder="اكتب أي شي: Premium, توصيل سريع, الأكثر مبيعا" class="w-full h-10 border rounded-full px-3 text-sm mt-1 bg-black text-white">

<label class="text-[11px] font-bold mt-2 block">الشارة اليمين (الخصم / جديد)</label>
<input id="badgeRight" value="-40%" placeholder="اكتب: -40% أو جديد أو حصري" class="w-full h-10 border rounded-full px-3 text-sm mt-1 bg-[#C8A97E] text-white">

<label class="text-[11px] font-bold mt-2 block">التقييم</label>
<input id="rating" value="5.0" class="w-full h-10 border rounded-full px-3 text-sm mt-1">

<button onclick="add()" class="w-full mt-4 bg-[#C8A97E] text-white h-12 rounded-full font-bold text-[15px]">إضافة المنتج ✅</button>
<p class="text-[10px] text-gray-400 text-center mt-2">المنتج يظهر فورا في الصفحة الرئيسية</p>
</div>

<div class="md:col-span-2 bg-white p-4 rounded-xl border">
<h3 class="font-bold flex justify-between">المنتجات الحالية <span id="count" class="bg-[#F9F6F1] px-3 py-1 rounded-full text-[12px]">0</span></h3>
<div id="list" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0] mt-3 border border-[#EDE8E0] rounded-xl overflow-hidden"></div>
</div>
</div>
</div>

<script>
let products=JSON.parse(localStorage.getItem('baytonia_products')||'null')||[];
function login(){if(document.getElementById('pass').value==='admin123'||document.getElementById('pass').value==='123'){localStorage.setItem('bay_admin','ok');show()}else alert('كلمة السر: admin123')}
function show(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}
if(localStorage.getItem('bay_admin')) show();
function render(){
 document.getElementById('count').innerText=products.length;
 document.getElementById('list').innerHTML=products.map(p=>`
 <div class="bg-white p-2 pb-3 relative">
  <div class="relative"><img src="${p.img}" class="w-full aspect-[4/3] object-cover rounded-lg"><span class="absolute top-2 left-2 bg-black text-white text-[9px] px-2 py-1 rounded">${p.badgeLeft}</span><span class="absolute top-2 right-2 bg-[#C8A97E] text-white text-[9px] px-2 py-1 rounded">${p.badgeRight}</span></div>
  <p class="text-[11px] mt-2 h-[28px] overflow-hidden">${p.name}</p><b class="text-[12px]">${p.price} ر.س</b>
  <button onclick="del(${p.id})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full">×</button>
 </div>`).join('');
 localStorage.setItem('baytonia_products',JSON.stringify(products));
}
function add(){
 const p={id:Date.now(),name:document.getElementById('name').value,img:document.getElementById('img').value||'https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=600',price:+document.getElementById('price').value||0,oldPrice:+document.getElementById('oldPrice').value||0,badgeLeft:document.getElementById('badgeLeft').value||'Premium',badgeRight:document.getElementById('badgeRight').value||'-40%',rating:document.getElementById('rating').value||'5.0'};
 if(!p.name||!p.price) return alert('اكتب الاسم والسعر على الأقل');
 products.unshift(p);render();
 document.getElementById('name').value='';document.getElementById('img').value='';document.getElementById('price').value='';document.getElementById('oldPrice').value='';
}
function del(id){products=products.filter(x=>x.id!==id);render()}
</script>
</body>
</html>
