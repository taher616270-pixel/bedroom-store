<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبو محمد اليافعي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet"><style>*{font-family:Tajawal}.scroll-hide::-webkit-scrollbar{display:none}.scroll-hide{scrollbar-width:none}</style></head>
<body class="bg-[#F9F6F1]">
<header class="bg-white sticky top-0 z-50 border-b border-[#EDE8E0]">
<div class="flex justify-between items-center px-4 h-[56px]">
<span id="siteName" class="font-black text-[19px]">أبو محمد اليافعي</span>
<div class="flex gap-3 items-center">
<a href="cart.html" class="relative"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span id="cartCount" class="absolute -top-2 -right-2 bg-[#C8A97E] text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span></a>
</div>
</div>
<div class="px-4 pb-3"><input id="search" placeholder="ابحث عن غرفة نوم..." class="w-full bg-[#F9F6F1] border rounded-full h-11 px-4 text-sm outline-none focus:border-[#C8A97E]"></div>
<div class="bg-[#A91D2A] text-white text-center py-3 text-[14px] font-bold">عروض نهاية العام 70% - خصومات كبرى</div>
</header>
<div id="products" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0]"></div>
<footer class="bg-[#111] text-white p-6 text-center">
<p id="footerText" class="text-[13px] leading-7 whitespace-pre-line">أبو محمد اليافعي - الدمام - غرف نوم فاخرة
واتساب: 05xxxxxxxx
توصيل لجميع مناطق المملكة</p>
<p class="text-[10px] text-[#666] mt-4">الدفع: Mada - Visa - Tabby - Tamara | <a href="admin/" class="underline text-[#C8A97E]">لوحة التحكم</a></p>
</footer>
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t h-[64px] flex justify-around items-center z-40 text-[10px]"><div class="text-center font-bold">الرئيسية</div><div class="text-center text-[#8a8a8a]">السلة</div><div class="text-center text-[#8a8a8a]">حسابي</div></nav>
<div class="h-[70px]"></div>

<!-- زر الشات مثل Baytonia -->
<div id="chatBtn" class="fixed bottom-[80px] left-5 bg-[#C8A97E] w-14 h-14 rounded-full flex items-center justify-center text-white text-xl shadow-lg cursor-pointer z-50">💬</div>
<div id="chatBox" class="hidden fixed bottom-[145px] left-4 right-4 md:left-auto md:w-[360px] bg-[#F5F1EB] rounded-2xl border shadow-2xl z-50 overflow-hidden">
<div class="bg-[#111] text-white p-4 flex justify-between"><b class="text-sm">مبيعات وطلبات الشراء</b><span onclick="document.getElementById('chatBox').classList.add('hidden')" class="cursor-pointer">×</span></div>
<div id="chatMsgs" class="p-4 h-[320px] overflow-y-auto space-y-3 text-[13px]"></div>
<div class="p-3 bg-white flex gap-2"><input id="chatInput" placeholder="اكتب رسالتك هنا..." class="flex-1 border rounded-full px-4 h-10 text-sm"><button onclick="sendChat()" class="bg-black text-white w-10 h-10 rounded-full">↑</button></div>
</div>

<script>
let defaultProducts=[{id:1,name:"سرير فلان مع مرآة 180x200",price:2699,oldPrice:4299,img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=600",badgeLeft:"Premium",badgeRight:"-37%",rating:"5.0"},{id:2,name:"طقم غرفة نوم نوفا 6 قطع",price:3799,oldPrice:5890,img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600",badgeLeft:"توصيل سريع",badgeRight:"-35%",rating:"4.9"},{id:3,name:"سرير روز المخملي الفاخر",price:4299,oldPrice:6999,img:"https://images.unsplash.com/photo-1617325247661-675ab4b64ae2?w=600",badgeLeft:"الأكثر مبيعا",badgeRight:"-38%",rating:"5.0"}];
let products=JSON.parse(localStorage.getItem('baytonia_products')||'null')||defaultProducts;
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function render(){
 document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
 let sn=localStorage.getItem('site_name'); if(sn) document.getElementById('siteName').innerText=sn;
 let ft=localStorage.getItem('footer_text'); if(ft) document.getElementById('footerText').innerText=ft;
 document.getElementById('products').innerHTML=products.map(p=>`<div onclick="location.href='product.html?id=${p.id}'" class="bg-white p-2 pb-3 cursor-pointer"><div class="relative"><img src="${p.img}" class="w-full aspect-[4/3] object-cover rounded-lg"><span class="absolute top-2 left-2 bg-black text-white text-[10px] px-2 py-1 rounded">${p.badgeLeft}</span><span class="absolute top-2 right-2 bg-[#C8A97E] text-white text-[10px] px-2 py-1 rounded">${p.badgeRight}</span></div><p class="text-[12px] mt-2 h-8 overflow-hidden">${p.name}</p><div class="flex gap-2 items-baseline mt-1"><b class="text-[13px]">${p.price.toLocaleString()} ر.س</b><span class="text-[11px] line-through text-gray-400">${p.oldPrice.toLocaleString()}</span></div><button class="w-full mt-2 border border-black rounded-full h-9 text-[12px] font-bold">أضف للسلة</button></div>`).join('');
 localStorage.setItem('baytonia_products',JSON.stringify(products));
}
render();
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value;if(!q)return render();const f=products.filter(p=>p.name.includes(q));document.getElementById('products').innerHTML=f.map(p=>`<div onclick="location.href='product.html?id=${p.id}'" class="bg-white p-2"><img src="${p.img}" class="w-full aspect-[4/3] rounded-lg"><p class="text-[12px] mt-2">${p.name}</p></div>`).join('')});
document.getElementById('chatBtn').onclick=()=>{document.getElementById('chatBox').classList.toggle('hidden');if(document.getElementById('chatMsgs').innerHTML===''){document.getElementById('chatMsgs').innerHTML=`<div class="bg-white p-3 rounded-xl">حياك الله عميلنا الغالي 🤍<br>مع مين حاب تتواصل اليوم؟</div><div class="flex flex-col gap-2 mt-2"><button onclick="quickChat('المبيعات')" class="bg-white border rounded-full py-2 text-sm">المبيعات</button><button onclick="quickChat('تتبع طلبي')" class="bg-white border rounded-full py-2 text-sm">تتبع طلبي - الاستفسار عن طلب</button><button onclick="quickChat('خدمة ما بعد البيع')" class="bg-white border rounded-full py-2 text-sm">تتبع خدمات ما بعد البيع</button></div>`}};
function quickChat(t){document.getElementById('chatMsgs').innerHTML+=`<div class="bg-[#C8A97E] text-white p-2 rounded-xl ml-auto w-fit">${t}</div>`;setTimeout(()=>{document.getElementById('chatMsgs').innerHTML+=`<div class="bg-white p-3 rounded-xl">تواصل معنا واتساب على 05xxxxxxxx وسنساعدك في ${t} فورا ✅<br><br><div class='border p-2 rounded'><input placeholder='05XXXXXXXX' class='w-full border rounded p-2 text-sm'><button class='w-full mt-2 bg-green-600 text-white rounded-full h-9 text-sm'>ارسل الرمز عبر واتساب</button></div></div>`;document.getElementById('chatMsgs').scrollTop=9999},400)}
function sendChat(){const v=document.getElementById('chatInput').value;if(!v)return;document.getElementById('chatMsgs').innerHTML+=`<div class="bg-[#C8A97E] text-white p-2 rounded-xl ml-auto w-fit">${v}</div>`;document.getElementById('chatInput').value='';setTimeout(()=>{document.getElementById('chatMsgs').innerHTML+=`<div class="bg-white p-3 rounded-xl">شكرا لتواصلك، سيتم الرد قريبا 🤍</div>`;document.getElementById('chatMsgs').scrollTop=9999},600)}
</script>
</body></html>
