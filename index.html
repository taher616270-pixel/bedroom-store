<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبو محمد اليافعي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800&display=swap" rel="stylesheet"><style>*{font-family:Tajawal}</style></head>
<body class="bg-[#F9F6F1]">
<header class="bg-white h-[56px] flex items-center justify-between px-4 border-b sticky top-0 z-50"><span class="font-black text-[19px]">أبو محمد اليافعي</span><span class="text-[12px] bg-black text-white px-3 py-1 rounded-full">الدمام</span></header>
<div id="products" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0]"></div>
<footer class="bg-[#111] text-white p-6 text-center"><p id="footerText" class="text-[13px] leading-7">أبو محمد اليافعي - غرف نوم فاخرة - الدمام<br>واتساب: 05xxxxxxxx<br>توصيل لجميع مناطق المملكة</p><p class="text-[10px] text-[#666] mt-4">الدفع: Mada - Visa - Tabby - Tamara | <a href="admin/" class="underline text-[#C8A97E]">لوحة التحكم</a></p></footer>
<script>
const products=JSON.parse(localStorage.getItem('baytonia_products')||'[]');
const list=document.getElementById('products');
if(products.length===0){list.innerHTML='<div class="col-span-2 bg-white p-10 text-center text-[14px]">ما فيه منتجات - ادخل لوحة التحكم وضيف أول منتج<br><a href=admin/ class=text-[#C8A97E] underline>دخول لوحة التحكم admin123</a></div>'}else{list.innerHTML=products.map(p=>`<div class="bg-white p-2"><div class="relative"><img src="${p.img}" class="w-full aspect-[4/3] object-cover rounded-lg"><span class="absolute top-2 left-2 bg-black text-white text-[10px] px-2 py-1 rounded">${p.badgeLeft||'Premium'}</span><span class="absolute top-2 right-2 bg-[#C8A97E] text-white text-[10px] px-2 py-1 rounded">${p.badgeRight||'-40%'}</span></div><p class="text-[12px] mt-2">${p.name}</p><b class="text-[13px]">${p.price} ر.س</b> <span class="text-[11px] line-through text-gray-400">${p.oldPrice||''}</span><button onclick="window.open('https://wa.me/966500000000?text='+encodeURIComponent(p.name),'_blank')" class="w-full mt-2 border border-black rounded-full h-9 text-[12px] font-bold">أضف للسلة</button></div>`).join('')}
const ft=localStorage.getItem('footer_text'); if(ft) document.getElementById('footerText').innerText=ft;
</script>
</body></html>
