<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أبو محمد اليافعي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet"><style>*{font-family:Tajawal}.scroll-hide::-webkit-scrollbar{display:none}</style></head>
<body class="bg-[#F9F6F1]">
<header class="bg-white sticky top-0 z-50 border-b"><div class="flex justify-between items-center px-4 h-[56px]"><span id="siteName" class="font-black text-[19px]">أبو محمد اليافعي</span><a href="cart.html" class="relative"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg><span id="cartCount" class="absolute -top-2 -right-2 bg-[#C8A97E] text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span></a></div><div class="px-4 pb-3"><input id="search" placeholder="ابحث..." class="w-full bg-[#F9F6F1] border rounded-full h-11 px-4 text-sm"></div><div class="bg-[#A91D2A] text-white text-center py-3 text-[14px] font-bold">عروض 70% - أبو محمد اليافعي</div></header>
<div id="products" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0]"></div>
<footer class="bg-[#111] text-white p-6 text-center"><p id="footerText" class="text-[13px] leading-7 whitespace-pre-line">أبو محمد اليافعي - الدمام</p><a href="admin/" class="text-[11px] text-[#C8A97E] underline mt-3 block">لوحة التحكم</a></footer>
<div id="chatBtn" class="fixed bottom-5 left-5 bg-[#C8A97E] w-14 h-14 rounded-full flex items-center justify-center text-white text-xl shadow-lg cursor-pointer z-50">💬</div>
<div id="chatBox" class="hidden fixed bottom-20 left-4 right-4 md:w-[360px] bg-[#F5F1EB] rounded-2xl border shadow-2xl z-50 overflow-hidden"><div class="bg-[#111] text-white p-4 flex justify-between"><b class="text-sm">خدمة العملاء</b><span onclick="chatBox.classList.add('hidden')" class="cursor-pointer">×</span></div><div id="chatMsgs" class="p-4 h-[300px] overflow-y-auto space-y-3 text-[13px]"></div><div class="p-3 bg-white flex gap-2"><input id="chatInput" placeholder="اكتب..." class="flex-1 border rounded-full px-4 h-10 text-sm"><button onclick="sendChat()" class="bg-black text-white w-10 h-10 rounded-full">↑</button></div></div>
<script>
let defaultProducts=[{id:1,name:"سرير فلان مع مرآة 180x200",price:2699,oldPrice:4299,img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=600",badgeLeft:"Premium",badgeRight:"-37%",rating:"5.0"},{id:2,name:"طقم غرفة نوم نوفا 6 قطع",price:3799,oldPrice:5890,img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600",badgeLeft:"توصيل سريع",badgeRight:"-35%",rating:"4.9"}];
let products=JSON.parse(localStorage.getItem('baytonia_products')||'null')||defaultProducts;
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function getWA(){return localStorage.getItem('wa_number')||'966500000000';}
function render(){
 document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
 let sn=localStorage.getItem('site_name'); if(sn) document.getElementById('siteName').innerText=sn; document.title=sn||'أبو محمد اليافعي';
 let ft=localStorage.getItem('footer_text'); if(ft) document.getElementById('footerText').innerText=ft;
 document.getElementById('products').innerHTML=products.map(p=>`<div onclick="location.href='product.html?id=${p.id}'" class="bg-white p-2 pb-3 cursor-pointer"><div class="relative"><img src="${p.img}" class="w-full aspect-[4/3] object-cover rounded-lg"><span class="absolute top-2 left-2 bg-black text-white text-[10px] px-2 py-1 rounded">${p.badgeLeft}</span><span class="absolute top-2 right-2 bg-[#C8A97E] text-white text-[10px] px-2 py-1 rounded">${p.badgeRight}</span></div><p class="text-[12px] mt-2 h-8 overflow-hidden">${p.name}</p><div class="flex gap-2 mt-1"><b class="text-[13px]">${p.price.toLocaleString()} ر.س</b><span class="text-[11px] line-through text-gray-400">${p.oldPrice.toLocaleString()}</span></div><button class="w-full mt-2 border border-black rounded-full h-9 text-[12px] font-bold">أضف للسلة</button></div>`).join('');
}
render();
chatBtn.onclick=()=>{chatBox.classList.toggle('hidden');if(chatMsgs.innerHTML===''){chatMsgs.innerHTML=`<div class="bg-white p-3 rounded-xl">حياك الله 🤍 مع أبو محمد اليافعي<br>كيف نقدر نساعدك؟</div><div class="flex flex-col gap-2"><button onclick="quickChat('المبيعات')" class="bg-white border rounded-full py-2 text-sm">المبيعات</button><button onclick="quickChat('تتبع طلبي')" class="bg-white border rounded-full py-2 text-sm">تتبع طلبي</button></div>`}};
function quickChat(t){chatMsgs.innerHTML+=`<div class="bg-[#C8A97E] text-white p-2 rounded-xl ml-auto w-fit">${t}</div>`;setTimeout(()=>{const wa=getWA();chatMsgs.innerHTML+=`<div class="bg-white p-3 rounded-xl">تواصل واتساب مباشر:<br><a href="https://wa.me/${wa}" target="_blank" class="text-green-600 underline">اضغط هنا ${wa}</a></div>`;chatMsgs.scrollTop=9999},400)}
function sendChat(){const v=chatInput.value;if(!v)return;chatMsgs.innerHTML+=`<div class="bg-[#C8A97E] text-white p-2 rounded-xl ml-auto w-fit">${v}</div>`;chatInput.value='';setTimeout(()=>{const wa=getWA();chatMsgs.innerHTML+=`<div class="bg-white p-3 rounded-xl"><a href="https://wa.me/${wa}?text=${encodeURIComponent(v)}" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded-full text-sm">ارسال واتساب</a></div>`;chatMsgs.scrollTop=9999},500)}
</script></body></html>
