<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAYTONIA - دار الراحة | غرف نوم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>*{font-family:'Tajawal',system-ui}.scroll-hide::-webkit-scrollbar{display:none}.scroll-hide{scrollbar-width:none}</style>
</head>
<body class="bg-[#F9F6F1] text-[#1a1a1a]">

<header class="bg-white sticky top-0 z-50 border-b border-[#EDE8E0]">
  <div class="flex items-center justify-between px-4 h-[56px]">
    <div class="flex items-center gap-3">
      <button class="w-8 h-8 flex flex-col gap-[4px] justify-center"><span class="h-[2px] bg-black w-5"></span><span class="h-[2px] bg-black w-5"></span><span class="h-[2px] bg-black w-3"></span></button>
      <span class="text-[18px] font-[800] tracking-[0.2em]">BAYTONIA</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span id="cartCount" class="absolute -top-1 -right-1 bg-[#C8A97E] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
  <div class="px-4 pb-3"><div class="relative"><input id="search" placeholder="ابحث" class="w-full bg-[#F9F6F1] border border-[#EDE8E0] rounded-full h-[44px] pr-4 pl-10 text-[14px] outline-none focus:border-[#C8A97E]"><svg class="absolute left-4 top-3" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div></div>
  <div class="flex gap-6 px-4 pb-3 overflow-x-auto scroll-hide text-[13px] font-[500] border-b border-[#F0EBE3]"><span class="whitespace-nowrap border-b-2 border-black pb-2 font-[700]">الكل</span><span class="whitespace-nowrap text-[#8a8a8a]">جديد بيتونيا</span><span class="whitespace-nowrap text-[#8a8a8a]">أطقم غرف</span><span class="whitespace-nowrap text-[#8a8a8a]">أثاث</span></div>
</header>

<div class="px-4 py-3 text-[12px] text-[#8a8a8a]">تشكيلة واسعة من غرف النوم الفاخرة التي تضمن لك الراحة والأناقة</div>

<div class="px-2 pb-2">
  <div class="flex gap-2 overflow-x-auto scroll-hide px-2">
    <div class="min-w-[115px] bg-white rounded-[12px] overflow-hidden border border-[#EDE8E0]"><img src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=400" class="h-[110px] w-full object-cover"><p class="text-[12px] text-center py-2 font-[600]">وحدة دريس</p></div>
    <div class="min-w-[115px] bg-white rounded-[12px] overflow-hidden border border-[#EDE8E0]"><img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400" class="h-[110px] w-full object-cover"><p class="text-[12px] text-center py-2 font-[600]">أسرة</p></div>
    <div class="min-w-[115px] bg-white rounded-[12px] overflow-hidden border border-[#EDE8E0]"><img src="https://images.unsplash.com/photo-1616627987427-6f17519d4b6a?w=400" class="h-[110px] w-full object-cover"><p class="text-[12px] text-center py-2 font-[600]">طقم غرفة نوم</p></div>
  </div>
</div>

<div class="flex items-center justify-between px-4 py-3 bg-white border-y border-[#EDE8E0]">
  <div class="flex gap-2"><button class="bg-white border border-[#EDE8E0] rounded-full px-4 h-8 text-[12px]">تصفية ▼</button><button class="bg-white border border-[#EDE8E0] rounded-full px-4 h-8 text-[12px]">الموصى به ▼</button></div>
  <span class="text-[12px]">قارن</span>
</div>

<div id="products" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0] border-b border-[#EDE8E0]"></div>

<footer class="bg-[#1a1a1a] text-[#a8a8a8]"><div class="p-6 text-center"><div class="bg-[#2a2a2a] rounded-[12px] p-4 mb-6"><p class="text-white text-[14px] font-[700]">تحتاج مساعدة؟ فريقنا في الخدمة</p><button class="mt-3 bg-[#C8A97E] text-white w-full h-10 rounded-[8px] text-[13px] font-bold">ابدأ المحادثة</button></div><p class="text-[11px] leading-6">السجل: 4030538031 - الضريبي: 3109615700003<br>الدفع: Mada - Visa - Tabby - Tamara<br><br><a href="admin/" class="text-[#C8A97E] underline">دخول لوحة التحكم</a></p></div></footer>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#EDE8E0] h-[64px] flex justify-around items-center z-40 text-[10px]">
  <div class="text-center font-bold"><div class="w-6 h-6 mx-auto mb-1 bg-black rounded-full"></div>الرئيسية</div>
  <div class="text-center text-[#8a8a8a]">المفضلة</div><div class="text-center text-[#8a8a8a]">السلة</div><div class="text-center text-[#8a8a8a]">حسابي</div>
</nav>
<div class="h-[64px]"></div>

<script>
const defaultProducts=[
{id:1,name:"سرير فلان مع مرآة 180x200",price:2699,oldPrice:4299,img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=600",badgeLeft:"Premium",badgeRight:"-37%",rating:"5.0"},
{id:2,name:"طقم غرفة نوم نوفا 6 قطع 200x180",price:3799,oldPrice:5890,img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600",badgeLeft:"توصيل سريع",badgeRight:"-35%",rating:"4.9"},
{id:3,name:"سرير روز المخملي الفاخر",price:4299,oldPrice:6999,img:"https://images.unsplash.com/photo-1617325247661-675ab4b64ae2?w=600",badgeLeft:"الأكثر مبيعاً",badgeRight:"-38%",rating:"5.0"},
{id:4,name:"غرفة أطفال بون بون",price:2890,oldPrice:4200,img:"https://images.unsplash.com/photo-1616627987427-6f17519d4b6a?w=600",badgeLeft:"جديد",badgeRight:"-31%",rating:"4.8"}
];
let products=JSON.parse(localStorage.getItem('baytonia_products')||'null')||defaultProducts;
function render(){
 document.getElementById('products').innerHTML=products.map(p=>`
 <div class="bg-white p-2 pb-3">
  <div class="relative"><img src="${p.img}" class="w-full aspect-[4/3] object-cover rounded-[8px]">
   <span class="absolute top-2 left-2 bg-[#1a1a1a] text-white text-[10px] px-2 py-1 rounded">${p.badgeLeft}</span>
   <span class="absolute top-2 right-2 bg-[#C8A97E] text-white text-[10px] px-2 py-1 rounded">${p.badgeRight}</span>
  </div>
  <p class="text-[12px] mt-2 leading-[16px] h-[32px] overflow-hidden">${p.name}</p>
  <div class="text-[11px] text-[#C8A97E] mt-1">★ ${p.rating}</div>
  <div class="flex gap-2 items-baseline mt-1"><b class="text-[14px]">${p.price.toLocaleString()} ر.س</b><span class="text-[11px] line-through text-[#999]">${p.oldPrice.toLocaleString()}</span></div>
  <button onclick="order('${p.name}',${p.price})" class="mt-2 w-full bg-white border border-black rounded-full h-[36px] text-[12px] font-[700]">أضف للسلة</button>
 </div>`).join('');
 document.getElementById('cartCount').innerText=products.length;
 localStorage.setItem('baytonia_products',JSON.stringify(products));
}
function order(name,price){window.open(`https://wa.me/966500000000?text=مرحبا أريد ${encodeURIComponent(name)} بسعر ${price} ر.س`,'_blank')}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value;const f=products.filter(p=>p.name.includes(q));if(q==='')render();else{document.getElementById('products').innerHTML=f.map(p=>`<div class="bg-white p-2"><img src="${p.img}" class="w-full aspect-[4/3] rounded-lg"><p class="text-[12px] mt-2">${p.name}</p><b>${p.price} ر.س</b></div>`).join('')}});
render();
</script>
</body>
</html>
