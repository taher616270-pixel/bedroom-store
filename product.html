<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet"><style>*{font-family:Tajawal}</style></head>
<body class="bg-white">
<header class="flex justify-between p-4 border-b sticky top-0 bg-white z-10"><a href="javascript:history.back()">‹ رجوع</a><a href="cart.html">السلة 🛒 <span id="cartCount">0</span></a></header>
<div id="product" class="p-4"></div>
<script>
let products=JSON.parse(localStorage.getItem('baytonia_products')||'[]');
const id=+new URLSearchParams(location.search).get('id');
const p=products.find(x=>x.id===id)||products[0];
function getWA(){return localStorage.getItem('wa_number')||'966500000000';}
document.getElementById('product').innerHTML=`
<div class="relative"><img src="${p.img}" class="w-full rounded-xl aspect-[4/3] object-cover"><span class="absolute top-3 left-3 bg-black text-white text-[10px] px-2 py-1 rounded">${p.badgeLeft}</span><span class="absolute top-3 right-3 bg-[#C8A97E] text-white text-[10px] px-2 py-1 rounded">${p.badgeRight}</span></div>
<h1 class="font-black text-[20px] mt-4">${p.name}</h1>
<div class="flex gap-2 items-baseline mt-2"><b class="text-[26px]">${p.price.toLocaleString()} ر.س</b><span class="line-through text-gray-400">${p.oldPrice.toLocaleString()}</span></div>
<div class="bg-[#F9F6F1] p-3 rounded-xl mt-4 text-[13px] leading-7">✔ خشب تايلندي درجة أولى<br>✔ يتضمن سرير + 2 كومدينة + دولاب<br>✔ ضمان 5 سنوات<br>✔ توصيل مجاني الدمام<br>✔ تقسيط Tabby / Tamara</div>
<div class="flex gap-3 mt-6"><div class="flex border rounded-full items-center"><button onclick="if(qty>1){qty--;qtyEl.innerText=qty}" class="w-12 h-12">-</button><span id="qtyEl" class="w-8 text-center font-bold">1</span><button onclick="qty++;qtyEl.innerText=qty" class="w-12 h-12">+</button></div><button onclick="addToCart()" class="flex-1 bg-black text-white rounded-full h-12 font-bold">أضف للسلة</button></div>
<button onclick="buyNow()" class="w-full mt-3 bg-[#C8A97E] text-white h-12 rounded-full font-bold">شراء مباشر واتساب</button>
<div class="mt-6 border-t pt-4"><p class="font-bold text-[14px]">المنتجات المشمولة</p><div class="mt-2 text-[12px] leading-7"><div class="flex justify-between"><span>كومدينة - واجهة زجاج</span><span>2 × 999 ر.س</span></div><div class="flex justify-between"><span>سرير 180x200 مع تخزين</span><span>1 × 2599 ر.س</span></div></div></div>
`;
let qty=1; const qtyEl=document.getElementById('qtyEl');
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
cartCount.innerText=cart.reduce((a,b)=>a+b.qty,0);
function addToCart(){let c=JSON.parse(localStorage.getItem('cart')||'[]');let ex=c.find(x=>x.id===p.id);if(ex)ex.qty+=qty;else c.push({...p,qty});localStorage.setItem('cart',JSON.stringify(c));location.href='cart.html'}
function buyNow(){const wa=getWA();window.open(`https://wa.me/${wa}?text=${encodeURIComponent('مرحبا أبو محمد اليافعي أريد '+p.name+' × '+qty)}`,'_blank')}
</script></body></html>
