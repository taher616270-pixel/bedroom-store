<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بحث - أبو محمد اليافعي</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet"><style>*{font-family:Tajawal}</style></head>
<body class="bg-white min-h-screen">
<header class="p-4 border-b flex gap-2 sticky top-0 bg-white"><a href="index.html" class="w-10 h-10 border rounded-full flex items-center justify-center">‹</a><input id="searchInput" placeholder="ماذا تبحث عنه؟ غرف نوم، كنب..." class="flex-1 border rounded-full h-10 px-4 text-sm" onkeydown="if(event.key==='Enter') doSearch()"><button onclick="doSearch()" class="bg-black text-white w-10 h-10 rounded-full">⌕</button></header>
<div class="p-3 text-[12px] text-gray-500">نتائج البحث عن: <b id="qText"></b></div>
<div id="results" class="grid grid-cols-2 gap-[1px] bg-[#EDE8E0]"></div>
<script>
let products=JSON.parse(localStorage.getItem('baytonia_products')||'[]');
function doSearch(){const q=searchInput.value.trim();qText.innerText=q;const f=products.filter(p=>p.name.includes(q));results.innerHTML=f.length?f.map(p=>`<div onclick="location.href='product.html?id=${p.id}'" class="bg-white p-2 cursor-pointer"><img src="${p.img}" class="w-full aspect-[4/3] rounded object-cover"><p class="text-[12px] mt-2 h-8 overflow-hidden">${p.name}</p><b class="text-[13px]">${p.price.toLocaleString()} ر.س</b></div>`).join(''):'<div class="col-span-2 p-10 text-center">لا يوجد نتائج لـ '+q+'</div>'; history.replaceState(null,'','search.html?q='+q)}
const qq=new URLSearchParams(location.search).get('q')||'';if(qq){searchInput.value=qq; qText.innerText=qq; const f=products.filter(p=>p.name.includes(qq));document.getElementById('results').innerHTML=f.map(p=>`<div onclick="location.href='product.html?id=${p.id}'" class="bg-white p-2 cursor-pointer"><img src="${p.img}" class="w-full aspect-[4/3] rounded object-cover"><p class="text-[12px] mt-2">${p.name}</p><b>${p.price} ر.س</b></div>`).join('');}
</script></body></html>
